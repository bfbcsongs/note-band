<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chords Transposer Pro</title>
    <!-- Lightweight Offline QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #141414;
            --border-color: #262626;
            --text-primary: #ededed;
            --chord-color: #22c55e;
            --section-color: #38bdf8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Sticky Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 10px 15px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        h1 { font-size: 1rem; font-weight: 600; }

        .toolbar {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn {
            background: #262626;
            color: #fff;
            border: 1px solid #404040;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 500;
        }

        .btn:hover { background: #404040; }
        .btn-primary { background: var(--accent-color); border: none; }
        .btn-primary:hover { background: var(--accent-hover); }

        .trans-badge {
            display: flex;
            align-items: center;
            background: #1f1f1f;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .trans-badge span {
            padding: 4px 8px;
            font-size: 0.8rem;
            font-family: monospace;
            border-right: 1px solid var(--border-color);
        }

        .trans-badge button {
            background: #262626;
            color: white;
            border: none;
            padding: 4px 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .trans-badge button:hover { background: #404040; }

        .workspace {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            background: var(--bg-color);
        }

        .screen.active {
            display: flex;
        }

        textarea {
            flex: 1;
            width: 100%;
            background: transparent;
            color: var(--text-primary);
            border: none;
            padding: 16px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .output-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 1.1rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .chord {
            color: var(--chord-color) !important;
            font-weight: bold !important;
        }

        .song-part {
            color: var(--section-color);
            font-weight: bold;
            margin-top: 12px;
            display: inline-block;
            text-transform: uppercase;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        /* Modal Popup para sa QR Code */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #141414;
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 8px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        #qrcode {
            padding: 12px;
            background: #ffffff;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Transposer Pro</h1>
        <div class="toolbar">
            <div class="trans-badge">
                <span>Key:<strong id="key-val">0</strong></span>
                <button onclick="transpose(-1)">-</button>
                <button onclick="transpose(1)">+</button>
            </div>
            <button class="btn" onclick="openQRModal()">QR Share</button>
            <button id="btn-play" class="btn btn-primary" onclick="switchMode('play')">Play</button>
            <button id="btn-edit" class="btn" onclick="switchMode('edit')">Edit</button>
        </div>
    </header>

    <div class="workspace">
        <!-- Edit Mode Screen -->
        <div id="screen-edit" class="screen">
            <textarea id="raw-input" placeholder="I-paste ang lyrics at chords dito..."></textarea>
        </div>

        <!-- Play Mode Screen -->
        <div id="screen-play" class="screen active">
            <div id="output" class="output-box">Wala pang nilalagay na chords. I-click ang 'Edit' para maglagay.</div>
        </div>
    </div>

    <!-- QR Code Popup Container -->
    <div id="qr-modal" class="modal-overlay" onclick="closeQRModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="font-size: 1.1rem; color: #fff;">Scan QR to Share</h3>
            <div id="qrcode"></div>
            <p style="font-size: 0.8rem; color: #888;">I-scan gamit ang phone camera para mabilis na ma-share ang kanta o app.</p>
            <button class="btn btn-primary" onclick="closeQRModal()">Close</button>
        </div>
    </div>

    <script>
        const notesSharp = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const notesFlat = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
        let currentSemitones = 0;
        let qrInstance = null;

        function getNoteIndex(note) {
            let idx = notesSharp.indexOf(note);
            if (idx === -1) idx = notesFlat.indexOf(note);
            return idx;
        }

        function transposeNote(chord) {
            let root = chord[0];
            if (chord.length > 1 && (chord[1] === '#' || chord[1] === 'b')) {
                root = chord.substring(0, 2);
            }
            let suffix = chord.substring(root.length);
            let idx = getNoteIndex(root);
            if (idx === -1) return chord;
            
            let newIdx = (idx + currentSemitones) % 12;
            if (newIdx < 0) newIdx += 12;
            return notesSharp[newIdx] + suffix;
        }

        function processText() {
            const text = document.getElementById('raw-input').value;
            if (!text.trim()) {
                document.getElementById('output').innerText = "Wala pang nilalagay na chords. I-click ang 'Edit' para maglagay.";
                return;
            }

            const lines = text.split('\n');
            let htmlOutput = '';
            const chordRegex = /\b([A-G][#b]?(?:m|maj|min|dim|aug|sus|7|9|11|13)?(?:\/[A-G][#b]?)?)\b/g;
            const partRegex = /^(?:\[.*\]|Intro|Verse\s*\d*|Chorus|Pre-Chorus|Bridge|Outro|Instrumental|Interlude)\s*[:]?$/i;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                let escapedLine = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                
                if (partRegex.test(line.trim())) {
                    htmlOutput += `<span class="song-part">${escapedLine}</span>\n`;
                } else {
                    let formattedLine = escapedLine.replace(chordRegex, (match) => {
                        let transposed = match.includes('/') 
                            ? match.split('/').map(c => transposeNote(c)).join('/')
                            : transposeNote(match);
                        return `<span class="chord">${transposed}</span>`;
                    });
                    htmlOutput += formattedLine + (i < lines.length - 1 ? '\n' : '');
                }
            }

            document.getElementById('output').innerHTML = htmlOutput;
            document.getElementById('key-val').innerText = currentSemitones > 0 ? `+${currentSemitones}` : currentSemitones;
        }

        function transpose(amount) {
            currentSemitones += amount;
            processText();
        }

        function switchMode(mode) {
            const editScreen = document.getElementById('screen-edit');
            const playScreen = document.getElementById('screen-play');
            const btnEdit = document.getElementById('btn-edit');
            const btnPlay = document.getElementById('btn-play');

            if (mode === 'edit') {
                editScreen.classList.add('active');
                playScreen.classList.remove('active');
                btnEdit.classList.add('btn-primary');
                btnPlay.classList.remove('btn-primary');
            } else {
                processText();
                editScreen.classList.remove('active');
                playScreen.classList.add('active');
                btnPlay.classList.add('btn-primary');
                btnEdit.classList.remove('btn-primary');
            }
        }

        /* QR Generator Functions */
        function openQRModal() {
            const modal = document.getElementById('qr-modal');
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = ''; // Clear previous QR

            // Gumamit ng kasalukuyang URL o kanta
            const currentText = document.getElementById('output').innerText;
            const textToShare = window.location.href; // O baguhin sa currentText kung gustong i-share ang raw lyrics

            qrInstance = new QRCode(qrContainer, {
                text: textToShare,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });

            modal.style.display = 'flex';
        }

        function closeQRModal() {
            document.getElementById('qr-modal').style.display = 'none';
        }

        document.getElementById('raw-input').addEventListener('input', processText);
    </script>
</body>
</html>
