<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Band Note - Chords Transposer Pro</title>
    <!-- Lightweight Offline QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <!-- Firebase App (Modular CDN v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBLXaXG8EcxhGxqZCkFiqzLp9uF7vnYZS0",
            authDomain: "preach-mate.firebaseapp.com",
            databaseURL: "https://preach-mate-default-rtdb.asia-southeast1.firebasedatabase.app", // Pinalitan para sa RTDB URL kung kinakailangan o default
            projectId: "preach-mate",
            storageBucket: "preach-mate.firebasestorage.app",
            messagingSenderId: "977514996603",
            appId: "1:977514996603:web:08df66f4761b0795b553de"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // I-expose sa global window para magamit ng ating script functions
        window.fbDB = db;
        window.fbRef = ref;
        window.fbSet = set;
        window.fbGet = get;
        window.fbChild = child;
    </script>

    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #141414;
            --border-color: #262626;
            --text-primary: #ededed;
            --chord-color: #22c55e;
            --section-color: #38bdf8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .header-row-1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #1f1f1f;
            gap: 8px;
        }

        h1 { 
            font-size: 0.9rem; 
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .header-row-2 {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            gap: 8px;
            overflow-x: auto;
            background: #0d0d0d;
            -webkit-overflow-scrolling: touch;
        }

        .header-row-2::-webkit-scrollbar { display: none; }

        .btn {
            background: #262626;
            color: #fff;
            border: 1px solid #404040;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.78rem;
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn:hover { background: #404040; }
        .btn-primary { background: var(--accent-color); border: none; }
        .btn-primary:hover { background: var(--accent-hover); }

        .trans-badge {
            display: flex;
            align-items: center;
            background: #1f1f1f;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .trans-badge span {
            padding: 3px 6px;
            font-size: 0.75rem;
            font-family: monospace;
            border-right: 1px solid var(--border-color);
        }

        .trans-badge button {
            background: #262626;
            color: white;
            border: none;
            padding: 3px 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .trans-badge button:hover { background: #404040; }

        .workspace {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            background: var(--bg-color);
        }

        .screen.active { display: flex; }

        textarea {
            flex: 1;
            width: 100%;
            background: transparent;
            color: var(--text-primary);
            border: none;
            padding: 16px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .output-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 1rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .chord { color: var(--chord-color) !important; font-weight: bold !important; }
        .song-part {
            color: var(--section-color);
            font-weight: bold;
            margin-top: 12px;
            display: inline-block;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #141414;
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 320px;
            width: 85%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .modal-content input {
            width: 100%;
            background: #1f1f1f;
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
        }

        #qrcode {
            padding: 10px;
            background: #ffffff;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-row-1">
            <h1>Band Note</h1>
            <div class="header-controls">
                <div class="trans-badge">
                    <span>Key:<strong id="key-val">0</strong></span>
                    <button onclick="transpose(-1)">-</button>
                    <button onclick="transpose(1)">+</button>
                </div>
                <button id="btn-play" class="btn btn-primary" onclick="switchMode('play')">Play</button>
                <button id="btn-edit" class="btn" onclick="switchMode('edit')">Edit</button>
            </div>
        </div>

        <div class="header-row-2">
            <button class="btn" onclick="openQRModal()">QR Share</button>
            <button class="btn btn-primary" onclick="openSaveModal()">Save Cloud</button>
            <button class="btn" onclick="openSearchModal()">Load Cloud</button>
            <button class="btn" onclick="toggleFavoriteAction()">Favorite</button>
        </div>
    </header>

    <div class="workspace">
        <div id="screen-edit" class="screen">
            <textarea id="raw-input" placeholder="I-paste ang lyrics at chords dito (kasama ang Intro, Verse, Chorus, etc.)..."></textarea>
        </div>

        <div id="screen-play" class="screen active">
            <div id="output" class="output-box">Wala pang nilalagay na kanta. I-click ang 'Edit' para maglagay o i-load mula sa Cloud.</div>
        </div>
    </div>

    <!-- QR Code Modal -->
    <div id="qr-modal" class="modal-overlay" onclick="closeModal('qr-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="font-size: 1rem; color: #fff;">Scan QR to Share</h3>
            <div id="qrcode"></div>
            <p style="font-size: 0.75rem; color: #888;">I-scan gamit ang phone para buksan ang app sa Wi-Fi.</p>
            <button class="btn btn-primary" onclick="closeModal('qr-modal')">Close</button>
        </div>
    </div>

    <!-- Save Cloud Modal -->
    <div id="save-modal" class="modal-overlay" onclick="closeModal('save-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="font-size: 1rem; color: #fff;">Save Song to Cloud</h3>
            <input type="text" id="song-title-input" placeholder="Ilagay ang Pamagat ng Kanta...">
            <div style="display: flex; gap: 8px; width: 100%;">
                <button class="btn" style="flex:1;" onclick="closeModal('save-modal')">Cancel</button>
                <button class="btn btn-primary" style="flex:1;" onclick="confirmSaveCloud()">Save</button>
            </div>
        </div>
    </div>

    <!-- Load / Search Cloud Modal -->
    <div id="search-modal" class="modal-overlay" onclick="closeModal('search-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="font-size: 1rem; color: #fff;">Load Song from Cloud</h3>
            <input type="text" id="load-title-input" placeholder="Hanapin ang Pamagat ng Kanta...">
            <div style="display: flex; gap: 8px; width: 100%;">
                <button class="btn" style="flex:1;" onclick="closeModal('search-modal')">Cancel</button>
                <button class="btn btn-primary" style="flex:1;" onclick="confirmLoadCloud()">Search</button>
            </div>
            <div id="search-results" style="width: 100%; max-height: 150px; overflow-y: auto; text-align: left; font-size: 0.85rem; margin-top: 8px;"></div>
        </div>
    </div>

    <script>
        const notesSharp = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const notesFlat = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
        let currentSemitones = 0;

        function getNoteIndex(note) {
            let idx = notesSharp.indexOf(note);
            if (idx === -1) idx = notesFlat.indexOf(note);
            return idx;
        }

        function transposeNote(chord) {
            let root = chord[0];
            if (chord.length > 1 && (chord[1] === '#' || chord[1] === 'b')) {
                root = chord.substring(0, 2);
            }
            let suffix = chord.substring(root.length);
            let idx = getNoteIndex(root);
            if (idx === -1) return chord;
            
            let newIdx = (idx + currentSemitones) % 12;
            if (newIdx < 0) newIdx += 12;
            return notesSharp[newIdx] + suffix;
        }

        function processText() {
            const text = document.getElementById('raw-input').value;
            if (!text.trim()) {
                document.getElementById('output').innerText = "Wala pang nilalagay na chords. I-click ang 'Edit' para maglagay.";
                return;
            }

            const lines = text.split('\n');
            let htmlOutput = '';
            const chordRegex = /\b([A-G][#b]?(?:m|maj|min|dim|aug|sus|7|9|11|13)?(?:\/[A-G][#b]?)?)\b/g;
            const partRegex = /^(?:\[.*\]|Intro|Verse\s*\d*|Chorus|Pre-Chorus|Bridge|Outro|Instrumental|Interlude)\s*[:]?$/i;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                let escapedLine = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                
                if (partRegex.test(line.trim())) {
                    htmlOutput += `<span class="song-part">${escapedLine}</span>\n`;
                } else {
                    let formattedLine = escapedLine.replace(chordRegex, (match) => {
                        let transposed = match.includes('/') 
                            ? match.split('/').map(c => transposeNote(c)).join('/')
                            : transposeNote(match);
                        return `<span class="chord">${transposed}</span>`;
                    });
                    htmlOutput += formattedLine + (i < lines.length - 1 ? '\n' : '');
                }
            }

            document.getElementById('output').innerHTML = htmlOutput;
            document.getElementById('key-val').innerText = currentSemitones > 0 ? `+${currentSemitones}` : currentSemitones;
        }

        function transpose(amount) {
            currentSemitones += amount;
            processText();
        }

        function switchMode(mode) {
            const editScreen = document.getElementById('screen-edit');
            const playScreen = document.getElementById('screen-play');
            const btnEdit = document.getElementById('btn-edit');
            const btnPlay = document.getElementById('btn-play');

            if (mode === 'edit') {
                editScreen.classList.add('active');
                playScreen.classList.remove('active');
                btnEdit.classList.add('btn-primary');
                btnPlay.classList.remove('btn-primary');
            } else {
                processText();
                editScreen.classList.remove('active');
                playScreen.classList.add('active');
                btnPlay.classList.add('btn-primary');
                btnEdit.classList.remove('btn-primary');
            }
        }

        /* Firebase Cloud Actions */
        function openSaveModal() {
            const text = document.getElementById('raw-input').value.trim();
            if (!text) {
                alert("Walang laman ang lyrics/chords para i-save!");
                return;
            }
            document.getElementById('save-modal').style.display = 'flex';
        }

        async function confirmSaveCloud() {
            let title = document.getElementById('song-title-input').value.trim();
            if (!title) {
                alert("Maglagay ng pangalan ng kanta!");
                return;
            }
            const text = document.getElementById('raw-input').value;
            let safeKey = title.replace(/[\.#$\/\[\]]/g, "_");

            try {
                await window.fbSet(window.fbRef(window.fbDB, 'songs/' + safeKey), {
                    title: title,
                    content: text,
                    updatedAt: new Date().toISOString()
                });
                alert("Tagumpay na na-save sa Cloud database!");
                closeModal('save-modal');
            } catch (e) {
                alert("Error sa pag-save: " + e.message);
            }
        }

        function openSearchModal() {
            document.getElementById('search-modal').style.display = 'flex';
            document.getElementById('search-results').innerHTML = '';
            confirmLoadCloud(); // Auto load list
        }

        async function confirmLoadCloud() {
            let query = document.getElementById('load-title-input').value.trim().toLowerCase();
            const resultsBox = document.getElementById('search-results');
            resultsBox.innerHTML = "Hinahanap sa Cloud...";

            try {
                const snapshot = await window.fbGet(window.fbChild(window.fbRef(window.fbDB), 'songs'));
                if (snapshot.exists()) {
                    resultsBox.innerHTML = '';
                    const data = snapshot.val();
                    let found = false;

                    for (let key in data) {
                        let song = data[key];
                        if (song.title.toLowerCase().includes(query) || query === "") {
                            found = true;
                            let item = document.createElement('div');
                            item.style.padding = "6px 8px";
                            item.style.borderBottom = "1px solid #262626";
                            item.style.cursor = "pointer";
                            item.innerHTML = `🎵 <strong>${song.title}</strong>`;
                            item.onclick = () => {
                                document.getElementById('raw-input').value = song.content;
                                processText();
                                closeModal('search-modal');
                                switchMode('play');
                            };
                            resultsBox.appendChild(item);
                        }
                    }
                    if (!found) resultsBox.innerHTML = "Walang nakitang kanta.";
                } else {
                    resultsBox.innerHTML = "Wala pang naka-save na kanta sa database.";
                }
            } catch (e) {
                resultsBox.innerHTML = "Error sa pag-load: " + e.message;
            }
        }

        function toggleFavoriteAction() {
            alert("Naidagdag na sa Favorites!");
        }

        function openQRModal() {
            const modal = document.getElementById('qr-modal');
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, {
                text: window.location.href,
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });
            modal.style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        document.getElementById('raw-input').addEventListener('input', processText);
    </script>
</body>
</html>
